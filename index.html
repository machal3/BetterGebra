<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Bettergebra — kalkulator wykresów funkcji, płaszczyzny zespolonej i zbiorów liczb zespolonych.">
  <title>Bettergebra</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23161618'/%3E%3Cpath d='M6 23c4.5 0 5.5-14 10-14s5.5 14 10 14' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    // Theme before first paint, so a dark-mode reload doesn't flash light. Always resolved to light or dark:
    // the Affect UI components switch on data-theme, not on the system preference.
    (() => {
      let t = null;
      try { t = JSON.parse(localStorage.getItem('bettergebra.v2') || 'null')?.theme; } catch {}
      document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <div id="root"></div>

  <div class="app">
    <aside class="sidebar b-dock" aria-label="Panel boczny">
      <div id="dock-head" class="b-dock-head"></div>
      <div id="graphs-body" class="sidebar-body"></div>
      <div id="geo-side" class="sidebar-body geo-side"></div>
      <div id="calc-side" class="sidebar-body calc-side"></div>
    </aside>

    <main id="stage" class="stage">
      <canvas id="plot" tabindex="0" aria-label="Wykres. Przeciągnij, aby przesunąć. Kółko lub gest przybliża. Strzałki przesuwają, plus i minus przybliżają, 0 przywraca widok."></canvas>
      <canvas id="hover" aria-hidden="true"></canvas>
      <div id="readout" class="readout" hidden></div>
    </main>

    <main id="calc" class="calc" aria-label="Kalkulator"></main>

    <main id="geometry" class="stage geometry" aria-label="Geometria">
      <canvas id="geo-canvas" aria-label="Rysunek geometryczny. Wybierz narzędzie na palecie albo w panelu Tworzenie i klikaj na płaszczyźnie."></canvas>
    </main>

    <div id="panebar"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
